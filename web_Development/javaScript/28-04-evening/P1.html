<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncronous_Asyncronous</title>
</head>
<body>
    

    <script>

        function multiply(a,b){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    var result=a*b;
                if(result==100){
                    resolve(result);
                }else{
                    reject(" A and B are not 10");
                }
                },2000)

            })
        }

        function sum(a,b){
            return new Promise((resolve,reject)=>{

                setTimeout(()=>{
                    var res=a+b;

                if(res==10){
                 resolve(res);
                }else{
                reject("sum of addition is not 10");
                    }
                },1000);

            });
        }

        sum(5,5).then((response)=>{
            console.log(response);
            return multiply(10,10);
        }).then((multres)=>{
            console.log(multres);
        }).catch((error)=>{
            console.log(error);
        });




    </script>
</body>
</html>
